spring:
  datasource:
    url: jdbc:h2:mem:excursiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-signing-key-change-before-production-123456}

logging:
  level:
   '[org.hibernate.SQL]': DEBUG