spring:
  application:
    name: rotaunica
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  web:
    error:
      include-binding-errors: always
      include-message: always

server:
  port: 8080

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    '[com.viagens.rotaunica]': DEBUG

